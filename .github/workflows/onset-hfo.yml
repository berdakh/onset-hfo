# Lint and test the Onset-HFO prototype.
#
# Everything here runs offline, and that is enforced rather than intended:
# tests/conftest.py sets ONSET_HFO_OFFLINE for the whole session and the single
# network choke point in onset_hfo.datasets refuses every outbound request. A
# test that reaches for the archive fails loudly instead of making a green CI
# depend on S3 being up.
name: onset-hfo

on:
  push:
    paths: ["onset-hfo/**", ".github/workflows/onset-hfo.yml"]
  pull_request:
    paths: ["onset-hfo/**", ".github/workflows/onset-hfo.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onset-hfo
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI end to end (synthetic data, no network)
        run: |
          python -m onset_hfo.cli run --synthetic --duration 30 --out artifacts/ci
          python -m onset_agent.cli --results artifacts/ci/sim-01_simulated_run-01 \
            --question "which channels have the highest ripple rate?"

  # The desktop reviewer. A job of its own because it needs Qt and a virtual
  # display, neither of which the pipeline, the agent or the studies require --
  # and because the point of this job is to prove the *installable product*
  # builds and opens, not just that the code imports.
  #
  # The Qt half of tests/test_review_app.py skips itself when the extra is
  # absent, which is what keeps the job above fast; here the extra is present,
  # so it runs.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onset-hfo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libdbus-1-3 libfontconfig1 libfreetype6
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,review]"
      - name: Lint
        run: ruff check onset_review
      - name: Test the reviewer, with a display
        env:
          QT_QPA_PLATFORM: offscreen
          MNE_BROWSER_BACKEND: qt
        run: xvfb-run -a pytest tests/test_review_app.py -q
      - name: The entry point starts and reports an empty cache honestly
        run: |
          python -m onset_review.app --list --cache-dir /tmp/empty-cache \
            && exit 1 || echo "correctly reported an empty cache"
          onset-review --help > /dev/null
