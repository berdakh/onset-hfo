[project]
name = "onset-hfo"
version = "0.3.9"
description = "Onset-HFO: an AI-assisted research tool for intracranial EEG -- high-frequency oscillations, interictal discharges and seizure onset, from raw recordings to a signed report, with an evidence-only assistant on an open-weight model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Berdakh Abibullaev", email = "berdakho@gmail.com" }]
keywords = ["ieeg", "hfo", "epilepsy", "ripples", "seizure", "mne", "agent", "llm"]
dependencies = [
    "mne>=1.6",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    # The clinical sheet that names the resected contacts in ds003498 is an
    # .xlsx. It is a core dependency rather than an extra because
    # ``onset-hfo outcome`` -- a documented command with its own notebook --
    # cannot run without it, and openpyxl is small and pure Python.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Everything needed to run the tests and the linter.
dev = ["pytest>=8", "ruff>=0.5", "scikit-learn>=1.3", "nbclient>=0.9", "nbformat>=5.9",
       "edfio>=0.4"]   # edfio: MNE writes the EDF the import test opens
# Run an open-weight model in-process (Colab). A server backend (Ollama, vLLM)
# needs nothing extra: it speaks HTTP. huggingface_hub is listed explicitly
# because onset_agent.hardware fetches weights with it rather than letting
# transformers do it, so that the disk is checked before the download starts.
# Exercised against torch 2.14 and transformers 5.18 as well as the floors.
llm = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.33",
       "huggingface_hub>=0.23"]
# Notebooks.
notebook = ["jupyter>=1.0", "ipywidgets>=8.1"]

# The reading interface (app/). Kept out of the core install because the
# pipeline, the agent and every study run without it -- the page is a way of
# reading results, not a way of producing them.
# 1.64 is what the root requirements.txt installs on Streamlit Cloud and
# what every page was verified against. The floor used to say 1.30,
# which had not been true since the pages started using width="stretch"
# and chart axis labels.
app = ["streamlit>=1.64"]

# The learned per-contact model, its calibration and its conformal sets.
# Everything else in the package runs without these.
ml = ["scikit-learn>=1.3"]

# The desktop reviewer (onset_review/). Qt plus MNE's own Qt-based iEEG
# browser, which the window embeds rather than reimplements. PySide6-Essentials
# rather than PySide6: the full wheel carries WebEngine, 3D, Charts, Multimedia
# and most of a gigabyte, none of which a trace viewer touches.
#
# mne-qt-browser is floored at 0.6 because `addDockWidget` on the figure is what
# the whole window layout rests on, and qtpy is explicit rather than inherited
# so the binding resolves the same way in the app as in the tests.
#
# Matplotlib is not listed: it is already a core dependency, and the 3D view's
# `backend_qtagg` needs only the Qt bindings this extra brings.
#
# scikit-learn is here because MNE's ``fastica`` ICA solver -- the one the
# Preprocessing panel offers first -- is scikit-learn's FastICA; without it
# the panel's Apply failed with an ImportError in the window.
#
# qtconsole (which brings ipykernel and IPython) is the Console pane: IPython
# in the window's own memory, as Spyder's. Without it the pane falls back to
# a plain Python console that says what to install.
#
# PySide6 is held below 6.12: with 6.12.0 the reviewer's tests all passed and
# the process then died -- "deallocating None: bug likely caused by a refcount
# error in a C extension" -- in PySide6's own code, on this project's code and
# on master's alike, while 6.11.2 exits cleanly. A refcount error can bring the
# window down at any time, not only at exit. Lift the bound once a 6.12 release
# runs the desktop job clean.
review = [
    "PySide6-Essentials>=6.6,<6.12",
    "mne-qt-browser>=0.6",
    "pyqtgraph>=0.13",
    "qtpy>=2.4",
    "scikit-learn>=1.3",
    "qtconsole>=5.5",
    # The template brain without a download: the glass brain and 3D view of a
    # case's contacts, and fsaverage5's surface when MNE's fsaverage has not
    # been fetched (onset_review.templatebrain, anatomy.nilearn_surface).
    "nilearn>=0.10",
]

[project.scripts]
onset-hfo = "onset_hfo.cli:main"
onset-agent = "onset_agent.cli:main"
onset-learn = "onset_hfo.learn:main"
onset-orchestrate = "onset_agent.orchestrate:main"
onset-review = "onset_review.app:main"

[project.urls]
"Homepage" = "https://berdakh.github.io/onset/"
"Source" = "https://github.com/berdakh/onset-hfo"
"Documentation" = "https://github.com/berdakh/onset-hfo/tree/master/onset-hfo/docs"
"Issues" = "https://github.com/berdakh/onset-hfo/issues"
# The cohort every measured number comes from. ds003029 is the ictal archive
# the pipeline also reads; it carries no HFO markings, so nothing is scored
# against it.
"Dataset (interictal, expert HFO markings)" = "https://openneuro.org/datasets/ds003498"
"Dataset (ictal)" = "https://openneuro.org/datasets/ds003029"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onset_hfo", "onset_agent", "onset_review"]

[tool.hatch.build.targets.sdist]
# The build tool sweeps up the working tree, and the working tree holds things
# that are not the software: the manuscript draft under paper/ (kept out of
# git on purpose), run artifacts, and earlier builds.
exclude = ["paper/", "artifacts/", "dist/", "**/__pycache__/"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are still linted for real errors (undefined names, unused imports);
# only notebook-idiomatic style is exempt: imports beside the code that uses
# them, and compact one-line plot styling.
"notebooks/*.ipynb" = ["E401", "E402", "E701", "E702", "I001"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
